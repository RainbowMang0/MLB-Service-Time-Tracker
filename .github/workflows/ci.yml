name: CI

# Every offline check, once per pull-request update and on pushes to main.
#
# A pull request used to run this twice: once for the push to the branch and
# again for the pull_request event. Push is limited to main so a commit on a
# PR branch produces one run. A push straight to main still runs once.
#
# WHY THIS EXISTS
# ===============
# Until 2026-09-08 nothing in this repository ran automatically. All four
# workflows were `workflow_dispatch` or `schedule`, so the 307 tests only ever
# ran when somebody remembered to open the Actions tab and pick "tests" from a
# dropdown. A change could be committed, merged, and served to a live site
# without a single test having run against it.
#
# That is the wrong way round for a project whose whole discipline is "pin the
# finding as a test". A test nobody runs is a comment.
#
# Everything here is OFFLINE and read-only: it makes no call to
# statsapi.mlb.com, writes no data and commits nothing, so it costs well under
# a minute and its answer depends only on the contents of this repository.
# (The one external thing it does is install `requests` from PyPI -- see the
# note on that step. Pip is cached, so the usual run does not reach the
# network at all.) The checks that need the MLB API -- the roster gate, the
# Baseball Reference comparison, a single-player probe -- stay in validate.yml,
# on demand, because they cost real API calls and their answer moves with the
# feed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ This step exists because the first version of this file did NOT have
      # it, on a comment asserting "the engine and its tests are stdlib-only on
      # purpose". That was written without checking and is false: the suite
      # imports backfill_history and update_service_time (to test the sanity
      # guards and the season-window cache), both of which import
      # fetch_mlb_data, which imports `requests` at module scope. Both of this
      # workflow's first two runs died on ModuleNotFoundError in 7 seconds.
      #
      # The ENGINE is stdlib-only -- service_time.py and cba.py import nothing
      # outside it, which is the property actually worth having. The tests are
      # not, because they reach into the modules that talk to the API. One
      # dependency, pinned in requirements.txt, installed in about five seconds.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 600-line cap (allowlist for files already over it) and a single
      # club-name table. Also fails if a suite under tests/ is not named
      # in this workflow.
      - name: File size cap and single club-name table
        run: python scripts/check_code_standards.py

      - name: Service-time engine and CBA rulesets
        run: python tests/test_service_time.py

      # Reference data for the service-time rewrite. Not read by the calculator.
      - name: Season calendar and service-time exceptions
        run: python tests/test_reference_data.py

      - name: Player page sections
        run: python tests/test_player_sections.py

      - name: Option years
        run: python tests/test_options.py

      - name: Golden service-time cases
        run: python tests/test_golden_players.py

      - name: Alumni page sections
        run: python tests/test_alumni_sections.py

      - name: Injured-list body-part labels
        run: python tests/test_injury_labels.py

      - name: Data query helper (fixtures only, no real data read)
        run: python tests/test_query_data.py

      - name: Raw transaction store
        run: python tests/test_raw_transactions.py

      - name: Daily fetch shape
        run: python tests/test_daily_fetch.py

      # The daily workflow skips a run only when a completion marker says a
      # full roster refresh already finished today. A partial run must not
      # count, and a rules-version mismatch in the published data warns
      # without failing.
      - name: Daily refresh completion marker, and rules-version warning
        run: python tests/test_refresh_complete.py

      # Validates data/lockout_updates.json against its own schema (required
      # fields, real ISO dates, https sources) AND builds docs/lockout.html
      # from it, so a bad hand-edit to that one file fails here rather than
      # shipping. See scripts/build_lockout_page.py.
      - name: CBA & lockout tracker page (data validation + build)
        run: |
          python scripts/build_lockout_page.py --check
          python tests/test_lockout.py

      - name: Duty-day allocation engine
        run: node --test tests/duty_days.test.cjs

      - name: Contract engine, and the advice-vocabulary lint
        run: node --test tests/contract.test.cjs

      # The browser-side twin of build_lockout_page.py's countdown/day-count
      # math (docs/lockout.js) -- includes the ET-anchored expiry instant and
      # the Tokyo/Los Angeles timezone-independence checks.
      - name: CBA & lockout tracker page (browser-side countdown logic)
        run: node --test tests/lockout.test.cjs

      # Header search suggestions. This file was not named by the steps
      # above, so it never ran. check_code_standards.py fails if another
      # suite under tests/ is left out the same way.
      - name: Header search suggestions
        run: node --test tests/typeahead.test.cjs

      # The three published files are derived from the database and are the
      # only two a visitor ever reads, so a bad derivation ships wrong numbers
      # while every check that reads the database still passes. This also
      # resolves every internal link on every generated page, which is what
      # catches the two slug functions drifting apart.
      - name: Published files agree, and every link resolves
        run: python scripts/validate_published.py
