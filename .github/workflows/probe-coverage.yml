name: Probe Transaction Coverage

# Diagnostic only -- reads from the API, writes nothing, commits nothing.
#
# The development sandbox cannot reach statsapi.mlb.com (the egress proxy
# 403s that host), so questions that need the live API get answered here
# instead. Run the relevant probe, then read the log; each one prints a
# verdict at the end.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which probe to run"
        type: choice
        required: true
        default: coverage
        options:
          - coverage # does /transactions carry pre-2009 history? (finding #1)
          - roster-history # can we read a club's roster as of a past date?
      players:
        description: "coverage probe only: space-separated names in quotes, blank for the flagged set"
        required: false
        default: ""

# Deliberately NOT in the service-time-update concurrency group: these jobs
# only read, so they cannot clobber the data file and are safe to run at any
# time, including while a backfill batch is going.

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe
        run: |
          case "${{ github.event.inputs.probe }}" in
            roster-history)
              python scripts/probe_roster_history.py
              ;;
            *)
              if [ -n "${{ github.event.inputs.players }}" ]; then
                python scripts/probe_coverage.py ${{ github.event.inputs.players }}
              else
                python scripts/probe_coverage.py
              fi
              ;;
          esac
