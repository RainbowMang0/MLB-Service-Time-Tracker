name: Validate Service Time

# Read-only. Measures accuracy; changes no data and commits nothing.
#
# Two independent checks, because they can fail in different ways:
#
#   rosters  -- compares computed intervals against MLB's own historical
#               rosters. Broad (thousands of player-date judgements) and
#               needs no hand-entered data, but it validates the pipeline
#               against the same source it is built on, so a systematic
#               misreading of MLB's semantics would pass.
#
#   super-two -- compares the computed Super Two cutoff against published
#               figures in data/reference_super_two.json. Offline: the cutoff
#               comes from season breakdowns already in the database, so this
#               validates exactly what the site publishes.
#
#   player    -- everything the model knows about ONE player in one season,
#               next to what the rosters say, day by day. The rosters check
#               names its worst players; this one explains them.
#
#   published -- do the three published files agree with each other? The
#               index and the profile shards are DERIVED from the database,
#               and they are the only two a visitor ever reads, so a bad
#               derivation ships wrong numbers while every other check --
#               all of which read the database -- passes. Offline.
#
#   tests     -- both unit suites: python tests/test_service_time.py (the
#               service-time engine and the CBA rulesets) and node --test
#               tests/duty_days.test.cjs (the duty-day allocation engine).
#               Offline, seconds, and neither needs anything installed.
#
#   reference -- compares finished figures against known Baseball Reference
#               numbers in data/reference_service_time.json. Narrow (a
#               handful of players, hand-entered) but genuinely independent,
#               which is exactly what the roster check cannot be.
#
# Run both before a mass backfill.
#
# The rosters check scores the carry-in rule both ways from a single fetch
# (carry_in: both), so an A/B costs one run and cannot drift between the two
# halves. See build_global_active_intervals in scripts/service_time.py.

on:
  workflow_dispatch:
    inputs:
      check:
        description: "Which check to run"
        type: choice
        required: true
        default: rosters
        options:
          - rosters
          - reference
          - super-two
          - player
          - published
          - tests
      team:
        description: "rosters: MLB team id (147 = Yankees)"
        required: false
        default: "147"
      season:
        description: "rosters: season year"
        required: false
        default: "2018"
      interval:
        description: "rosters: days between sampled dates"
        required: false
        default: "7"
      player_id:
        description: "player: MLB person id to diagnose (e.g. 641386)"
        required: false
        default: ""
      carry_in:
        description: "rosters: carry-in rule (both = A/B in one run)"
        type: choice
        required: false
        default: both
        options:
          - both
          - "off"
          - "on"

# Read-only, so deliberately outside the service-time-update concurrency
# group -- safe to run while a backfill batch is going.

jobs:
  validate:
    runs-on: ubuntu-latest
    # A wide rosters sweep is many club-seasons of API calls; single checks
    # still finish in about a minute.
    timeout-minutes: 320
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        # Only the duty-day engine needs it, and only its tests. The engine
        # itself ships to the browser as a plain script -- no npm, no build
        # step, and node's built-in test runner needs no packages either.
        if: github.event.inputs.check == 'tests'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run check
        run: |
          case "${{ github.event.inputs.check }}" in
            reference)
              python scripts/validate_service_time.py
              ;;
            super-two)
              python scripts/validate_super_two.py
              ;;
            tests)
              python tests/test_service_time.py
              node --test tests/duty_days.test.cjs
              ;;
            published)
              python scripts/validate_published.py
              ;;
            player)
              python scripts/probe_player.py \
                --player "${{ github.event.inputs.player_id }}" \
                --team "${{ github.event.inputs.team }}" \
                --season "${{ github.event.inputs.season }}" \
                --interval "${{ github.event.inputs.interval }}"
              ;;
            *)
              python scripts/validate_against_rosters.py \
                --team "${{ github.event.inputs.team }}" \
                --season "${{ github.event.inputs.season }}" \
                --interval "${{ github.event.inputs.interval }}" \
                --carry-in "${{ github.event.inputs.carry_in }}"
              ;;
          esac
