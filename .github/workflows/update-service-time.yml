name: Daily Service Time Update

# Runs every day at 8:00 AM US/Eastern (America/New_York) and refreshes
# docs/data/service_time.json from the MLB Stats API, then commits the
# result so GitHub Pages redeploys the site automatically.
#
# Why two cron entries: GitHub Actions cron is UTC-only, and US/Eastern
# alternates between UTC-4 (EDT, roughly March-November) and UTC-5 (EST,
# roughly November-March). Rather than hardcoding one offset and drifting
# an hour twice a year, this fires at both 12:00 UTC and 13:00 UTC and lets
# the "gate" step below check the *actual* Eastern wall-clock hour and
# no-op unless it's really 8am there. Net effect: the update runs once a
# day, at 8am Eastern, correct through DST changes, with no manual upkeep.

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: # lets you trigger a manual run from the Actions tab
    inputs:
      force:
        description: "Run now regardless of the 8am ET gate (use this for the first-time real data pull)"
        type: boolean
        default: false
      full_refresh:
        description: "Ignore the transaction cache and re-pull each player's full history"
        type: boolean
        default: false
      recompute_derived:
        description: "Rewrite the published files from the stored database, no API calls (use after a template or derived-data change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: service-time-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Checkout comes FIRST because the gate below reads the database to
      # decide whether today's update has already happened.
      - name: Checkout
        uses: actions/checkout@v4

      # THE GATE, and why it is not "is it 8am in New York".
      #
      # It used to be exactly that: run only when the Eastern hour reads 08,
      # with two cron entries covering the EDT/EST shift. That assumes a
      # scheduled workflow starts when it is scheduled, and GitHub does not
      # promise this -- under load, runs are queued and start late. Measured
      # 2026-09-01 over the eight scheduled runs since 2026-08-28: every one
      # started between 3h12m and 9h54m late, so the Eastern hour read 12 to
      # 18 and the gate rejected all eight. Each reported SUCCESS in under
      # ten seconds, because a gated-out job skips every later step and skips
      # are not failures. The rostered figures sat five days stale while the
      # workflow reported success daily -- found only because a player was
      # spotted with three days of service time who plainly had more.
      #
      # So the gate no longer asks what time it is. It asks whether the work
      # has been done, which is the question it always meant:
      #
      #   run  <=>  it is 8am Eastern or later  AND  the records were not
      #             already refreshed today
      #
      # "8am Eastern or later" keeps the original intent -- give the previous
      # day's transactions time to settle -- while tolerating any delay. The
      # second half makes the job idempotent, so the two cron entries cannot
      # both do the work, and self-correcting, so a delayed or missed run is
      # simply picked up by the next fire.
      #
      # The dates are compared in UTC on purpose. `last_updated` is stamped
      # with the RUNNER's date (TODAY = dt.date.today() in
      # update_service_time.py), and the runner is UTC -- so comparing it
      # against an Eastern date would disagree every evening once UTC has
      # rolled over and Eastern has not.
      - name: Gate -- 8am Eastern or later, and not already done today
        id: gate
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual force run requested -- skipping the gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR="$(TZ="America/New_York" date +%H)"
          TODAY_UTC="$(date -u +%F)"
          LAST="$(python3 -c "
          import json
          d = json.load(open('docs/data/service_time.json'))
          seen = [p.get('last_updated') for p in d['players'] if p.get('on_40_man')]
          print(max([x for x in seen if x], default=''))
          ")"
          echo "Eastern hour $HOUR | today (UTC) $TODAY_UTC | rostered last_updated $LAST"

          if [ "$LAST" = "$TODAY_UTC" ]; then
            echo "Already refreshed today -- nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$HOUR))" -ge 8 ]; then
            echo "Due, and it is 8am Eastern or later. Running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Due, but it is before 8am Eastern. Waiting for the next fire."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run service time update
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ github.event.inputs.recompute_derived }}" = "true" ]; then
            # Template or derived-data change only: the stored records are
            # already correct, so re-fetching every player's transactions
            # would buy nothing and cost half an hour of API calls.
            python scripts/update_service_time.py --recompute-derived
          elif [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            python scripts/update_service_time.py --full-refresh
          else
            python scripts/update_service_time.py
          fi

      - name: Commit and push changes
        if: steps.gate.outputs.run == 'true'
        run: |
          # The whole data directory, not just service_time.json: the job
          # also writes index.json (what the browser downloads) and the
          # profiles/ shards. Staging only the database left the compact
          # index frozen at whatever was last committed by hand, so the
          # site would have quietly served stale figures forever.
          #
          # commit_data.sh, not a plain push: this job is half an hour of
          # API calls and a push rejected by a concurrent commit to main
          # throws all of it away. See the header of that script.
          scripts/commit_data.sh \
            "chore: daily service time update ($(date -u +%F))" \
            docs/data docs/p docs/t docs/page.css docs/404.html docs/service-time.html \
            docs/sitemap.xml docs/robots.txt data/cache
