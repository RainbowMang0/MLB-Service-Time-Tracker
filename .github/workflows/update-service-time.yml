name: Daily Service Time Update

# Runs every day at 8:00 AM US/Eastern (America/New_York) and refreshes
# docs/data/service_time.json from the MLB Stats API, then commits the
# result so GitHub Pages redeploys the site automatically.
#
# Why two cron entries: GitHub Actions cron is UTC-only, and US/Eastern
# alternates between UTC-4 (EDT, roughly March-November) and UTC-5 (EST,
# roughly November-March). Rather than hardcoding one offset and drifting
# an hour twice a year, this fires at both 12:00 UTC and 13:00 UTC and lets
# the "gate" step below check the *actual* Eastern wall-clock hour and
# no-op unless it's really 8am there. Net effect: the update runs once a
# day, at 8am Eastern, correct through DST changes, with no manual upkeep.
#
# The same file also keeps data/raw_transactions fresh. That folder is the
# raw feed, one file per published player. The site's figures are still
# calculated from data/cache/transactions, and this folder is not part of
# the published site. Each morning the raw-store job asks for the last few
# days of transactions and updates the players who moved. Sunday afternoon
# it fetches every player again and replaces each file, so a correction to
# an older day is not missed. See the raw-transactions job below.

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * 0" # Sunday afternoon UTC: full re-pull of the raw store
  workflow_dispatch: # lets you trigger a manual run from the Actions tab
    inputs:
      force:
        description: "Run now regardless of the 8am ET gate (use this for the first-time real data pull)"
        type: boolean
        default: false
      full_refresh:
        description: "Ignore the transaction cache and re-pull each player's full history"
        type: boolean
        default: false
      recompute_derived:
        description: "Rewrite the published files from the stored database, no API calls (use after a template or derived-data change)"
        type: boolean
        default: false
      raw_store:
        description: "Raw transaction files. window = recent days, refresh = full re-pull, fill = resume players still missing, skip = leave the store alone"
        type: choice
        default: window
        options:
          - window
          - refresh
          - fill
          - skip

permissions:
  contents: write

concurrency:
  group: service-time-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The backup switch (README.md, "Turning off live fetching"). A repo
      # variable so it can be flipped from the Settings UI with no code
      # change or redeploy, independent of any one workflow_dispatch run;
      # unset reads as "true" both here and in update_service_time.py, so
      # the default is enabled.
      MLB_FETCH_ENABLED: ${{ vars.MLB_FETCH_ENABLED }}
    steps:
      # Checkout comes FIRST because the gate below reads the database to
      # decide whether today's update has already happened.
      - name: Checkout
        uses: actions/checkout@v4

      # THE GATE, and why it is not "is it 8am in New York".
      #
      # It used to be exactly that: run only when the Eastern hour reads 08,
      # with two cron entries covering the EDT/EST shift. That assumes a
      # scheduled workflow starts when it is scheduled, and GitHub does not
      # promise this -- under load, runs are queued and start late. Measured
      # 2026-09-01 over the eight scheduled runs since 2026-08-28: every one
      # started between 3h12m and 9h54m late, so the Eastern hour read 12 to
      # 18 and the gate rejected all eight. Each reported SUCCESS in under
      # ten seconds, because a gated-out job skips every later step and skips
      # are not failures. The rostered figures sat five days stale while the
      # workflow reported success daily -- found only because a player was
      # spotted with three days of service time who plainly had more.
      #
      # So the gate no longer asks what time it is. It asks whether a
      # complete refresh already finished:
      #
      #   run  <=>  it is 8am Eastern or later  AND  no complete refresh
      #             has finished today
      #
      # "8am Eastern or later" keeps the original intent -- give the previous
      # day's transactions time to settle -- while tolerating any delay. The
      # second half makes the job idempotent, so the two cron entries cannot
      # both do the work, and self-correcting, so a delayed or missed run is
      # simply picked up by the next fire.
      #
      # "Finished" is data/refresh_complete.json, written only after a roster
      # refresh has rebuilt every rostered player and published. A partial or
      # failed run does not write it. The newest rostered last_updated is the
      # wrong signal: one rebuilt record moves that date to today. On
      # 2026-11-08 four rostered records carried that date and both scheduled
      # runs skipped the other 1,111. The second cron of a day also often
      # checks out the commit from before the first run pushed (2026-11-01
      # and 2026-11-02 both did the full refresh twice), so the marker is
      # read from the branch tip, not from this checkout.
      #
      # The date is UTC on purpose. The marker is stamped with the runner's
      # UTC date when the run finishes, and the runner is UTC -- comparing
      # it with an Eastern date would disagree every evening once UTC has
      # rolled over and Eastern has not.
      - name: Gate -- 8am Eastern or later, and not already done today
        id: gate
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual force run requested -- skipping the gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR="$(TZ="America/New_York" date +%H)"
          TODAY_UTC="$(date -u +%F)"
          BRANCH="${GITHUB_REF_NAME}"
          MARKER="/tmp/refresh_complete.json"
          rm -f "$MARKER"
          # The branch tip, not this checkout. The other cron entry is often
          # triggered on the same commit and cannot see a refresh that already
          # finished and pushed. A failed fetch means "not done": running
          # again is safe, skipping on a guess is not.
          if git fetch --depth=1 --quiet origin "$BRANCH"; then
            if git cat-file -e "origin/${BRANCH}:data/refresh_complete.json" 2>/dev/null; then
              git show "origin/${BRANCH}:data/refresh_complete.json" > "$MARKER"
            fi
          else
            echo "Could not fetch origin/${BRANCH}. Treating today as not yet refreshed."
          fi
          DONE="$(python3 scripts/refresh_complete.py --today "$TODAY_UTC" --marker "$MARKER")"
          echo "Eastern hour $HOUR | today (UTC) $TODAY_UTC | complete refresh already finished today: $DONE"

          if [ "$DONE" = "yes" ]; then
            echo "A complete refresh already finished today -- nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$HOUR))" -ge 8 ]; then
            echo "Due, and it is 8am Eastern or later. Running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Due, but it is before 8am Eastern. Waiting for the next fire."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch team schedules
        # One API call, and it feeds the duty-day tool at
        # docs/taxes.html: that page runs entirely in the browser, so the
        # schedule has to already be sitting there as a static file.
        #
        # Daily rather than once a season, because games genuinely move --
        # rainouts, doubleheaders and postseason dates all rewrite the
        # calendar, and a duty day in the wrong state is a wrong allocation.
        #
        # Skipped under --recompute-derived, which promises to make no API
        # calls at all. Failure is non-fatal on purpose: the service-time
        # pipeline is the primary job here and must not be lost to a schedule
        # endpoint having a bad morning.
        if: steps.gate.outputs.run == 'true' && github.event.inputs.recompute_derived != 'true'
        continue-on-error: true
        run: python scripts/fetch_schedules.py --season "$(date -u +%Y)"

      - name: Run service time update
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ github.event.inputs.recompute_derived }}" = "true" ]; then
            # Template or derived-data change only: the stored records are
            # already correct, so re-fetching every player's transactions
            # would buy nothing and cost half an hour of API calls.
            python scripts/update_service_time.py --recompute-derived
          elif [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            python scripts/update_service_time.py --full-refresh
          else
            python scripts/update_service_time.py
          fi

      # Keeps the countdown/day-count on docs/lockout.html correct even on a
      # day data/lockout_updates.json itself doesn't change -- the page's own
      # inline script recomputes it in the browser too (see
      # scripts/build_lockout_page.py), but there's no reason to let the
      # server-rendered fallback drift when the daily job is already running
      # anyway. No API calls; it only reads data/lockout_updates.json.
      #
      # continue-on-error: true is load-bearing, not cosmetic. This step can
      # fail for a reason that has nothing to do with the 5,600-player
      # pipeline this job exists to run: a bad hand-edit to
      # data/lockout_updates.json. CI (ci.yml) already runs
      # `build_lockout_page.py --check` on every push and PR, so a bad edit
      # is rejected before it ever reaches main -- but if one slips through
      # anyway, this step must not take the "Commit and push changes" step
      # down with it. On failure, the existing docs/lockout.html is simply
      # left as it is and committed unchanged; everything else this job
      # computed still ships.
      - name: Rebuild the CBA & lockout tracker page
        id: rebuild_lockout
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/build_lockout_page.py

      - name: Warn if the lockout page could not be rebuilt
        if: steps.gate.outputs.run == 'true' && steps.rebuild_lockout.outcome == 'failure'
        run: echo "::warning::docs/lockout.html was not rebuilt (data/lockout_updates.json failed validation) -- kept the existing page. See the 'Rebuild the CBA & lockout tracker page' step above."

      - name: Commit and push changes
        if: steps.gate.outputs.run == 'true'
        run: |
          # The whole data directory, not just service_time.json: the job
          # also writes index.json (what the browser downloads) and the
          # profiles/ shards. Staging only the database left the compact
          # index frozen at whatever was last committed by hand, so the
          # site would have quietly served stale figures forever.
          #
          # commit_data.sh, not a plain push: this job is half an hour of
          # API calls and a push rejected by a concurrent commit to main
          # throws all of it away. See the header of that script.
          #
          # data/refresh_complete.json is the "this refresh finished" marker
          # the gate reads. It sits outside the site directory. The backfill
          # job does not commit it: on a rejected push that job restores its
          # own copy of each listed path, and an older marker would make a
          # finished day look unfinished.
          scripts/commit_data.sh \
            "chore: daily service time update ($(date -u +%F))" \
            docs/data docs/p docs/t docs/alumni docs/page.css docs/404.html docs/service-time.html \
            docs/arbitration-eligible.html docs/super-two.html docs/lockout.html \
            docs/lockout-salary-cap.html \
            docs/non-tender-watch.html docs/free-agents.html docs/options.html \
            docs/sitemap.xml docs/sitemap-core.xml docs/sitemap-clubs.xml \
            docs/sitemap-players.xml docs/sitemap-alumni.xml docs/robots.txt data/cache \
            data/published_ids.json data/refresh_complete.json

  # Raw feed, kept beside the roster cache. This job does not calculate
  # service time, options, or injured-list time, and it does not write
  # anything under docs/. data/cache/transactions stays the input those
  # figures are built from until a later change points them at this store.
  raw-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether the raw store should run
        id: rawgate
        run: |
          MODE="window"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.raw_store }}"
          elif [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then
            MODE="refresh"
          fi
          if [ "$MODE" = "skip" ] || [ -z "$MODE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Raw transaction store left as it is."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$MODE" = "window" ]; then
            HOUR="$(TZ=America/New_York date +%H)"
            if [ "$((10#$HOUR))" -lt 8 ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Before 8am Eastern. The later fire will update the raw store."
              exit 0
            fi
            LAST="$(python3 -c "import json; print(json.load(open('data/raw_transactions/_state.json')).get('last_window_utc_date',''))" 2>/dev/null || true)"
            TODAY="$(date -u +%F)"
            if [ "$LAST" = "$TODAY" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Recent-days window already applied today."
              exit 0
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.rawgate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.rawgate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Update the raw transaction store
        if: steps.rawgate.outputs.run == 'true'
        run: |
          set -uo pipefail
          MODE="${{ steps.rawgate.outputs.mode }}"
          if [ "$MODE" = "window" ]; then
            python scripts/raw_transactions.py --window
            code=$?
            scripts/commit_data.sh \
              "chore: raw transaction window ($(date -u +%F))" \
              data/raw_transactions
            if [ $? -ne 0 ]; then
              exit 1
            fi
            exit "$code"
          fi

          # fill resumes players who have no good file yet. refresh replaces
          # every file, continuing a pass that started in the last two days.
          FLAG="--refresh"
          REMAINING_LABEL="refresh_remaining"
          if [ "$MODE" = "fill" ]; then
            FLAG="--full"
            REMAINING_LABEL="remaining"
          fi
          prev=""
          for _batch in $(seq 1 20); do
            python scripts/raw_transactions.py "$FLAG" --limit 400
            code=$?
            scripts/commit_data.sh \
              "chore: raw transaction store ($(date -u +%F))" \
              data/raw_transactions
            if [ $? -ne 0 ]; then
              exit 1
            fi
            rem="$(python scripts/raw_transactions.py --status | sed -n "s/^${REMAINING_LABEL}: //p")"
            echo "$REMAINING_LABEL=$rem (exit $code)"
            if [ "$rem" = "0" ]; then
              exit 0
            fi
            if [ "$code" != "0" ] || [ "$rem" = "$prev" ]; then
              echo "Stopping. This batch did not move the remaining count."
              exit 1
            fi
            prev="$rem"
          done
          echo "Batch cap reached with players still remaining."
          exit 1
